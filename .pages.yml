# Pages CMS configuration — https://pagescms.org
#
# This file defines the editor forms for the Fixing Systems Georgia catalog.
# Editors open https://app.pagescms.org/mikirvalidze19/fixing, log in with a
# GitHub account that has write access to this repository, and manage the
# content. Every save is a commit; Cloudflare Pages rebuilds and publishes
# automatically.
#
# The site (React app) reads everything from the `content/` folder at build
# time via src/data/catalog.ts — no backend involved. The variant tables are
# fully CMS-driven: see docs/TABLE-ARCHITECTURE.md.

media:
  - name: products
    label: Product photos
    input: content/images/products
    output: /content/images/products
    extensions: [webp, jpg, jpeg, png]
  - name: badges
    label: Certification badge artwork
    input: content/images/badges
    output: /content/images/badges
    extensions: [webp, jpg, jpeg, png, svg]
  - name: icons
    label: Spec icon artwork
    input: content/images/icons
    output: /content/images/icons
    extensions: [webp, jpg, jpeg, png, svg]
  - name: standards
    label: Standards artwork
    input: content/images/standards
    output: /content/images/standards
    extensions: [webp, jpg, jpeg, png, svg]
  - name: slider
    label: Slider images
    input: content/images/slider
    output: /content/images/slider
    extensions: [webp, jpg, jpeg, png]
  - name: applications
    label: Application images
    input: content/images/applications
    output: /content/images/applications
    extensions: [webp, jpg, jpeg, png]
  - name: categories
    label: Category icons
    input: content/images/categories
    output: /content/images/categories
    extensions: [webp, jpg, jpeg, png]
  - name: videos
    label: Slider videos
    input: content/videos
    output: /content/videos
    extensions: [mp4, webm, mov]

content:
  # ---------------------------------------------------------------- products
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    view:
      primary: id
      sort: series
      order: asc
    fields:
      - name: id
        label: ID (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Lowercase letters/numbers/dashes, unique. Becomes the page address (/product/{id}), e.g. hxe01"
      - name: series
        label: Series code
        type: string
        required: true
        description: "As printed on the price list, e.g. HXE01"
      - name: groupNumber
        label: Catalog order (1 = first)
        type: number
        description: "Optional — products are listed from the lowest number up (existing products already carry 1–28). Leave empty → sorted alphabetically at the end."
      - name: titleEn
        label: Title (English)
        type: string
        required: true
      - name: titleKa
        label: Title (Georgian)
        type: string
        required: true
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          value: "{id}"
          label: "{labelEn}"
        description: "Where the product appears in the catalog and the Products menu — pick from the live list (add a new one under Catalog categories in the sidebar). Never rename a category's ID once products point to it."
      - name: applications
        label: Applications (usage pages the product belongs to)
        type: reference
        options:
          collection: applications
          multiple: true
          value: "{id}"
          label: "{labelEn}"
        description: "Where this product is used — Roofing, Solar panels, HVAC… Multi-select; an application can mix products from one or more categories, so pick EVERY application that applies. The matching /applications/<id> page automatically lists this product (leave empty for none)."
      - name: youtube
        label: YouTube link
        type: string
        description: "Paste the full YouTube link (watch/youtu.be) or just the video ID. Shown at the bottom of the product page."
      - name: image
        label: Product photo
        type: image
        options:
          media: products
          rename: safe
        description: "Tip: name the file after the product ID before uploading (e.g. hxe01.jpg). Without a photo the site shows the series code."
      - name: descriptionEn
        label: Description (English)
        type: text
        description: "Optional. Leave empty to auto-generate the intro text from the price table."
      - name: descriptionKa
        label: Description (Georgian)
        type: text
        description: "Optional. Leave empty to auto-generate the intro text from the price table."
      - name: certifications
        label: Certifications
        type: reference
        options:
          collection: badges
          multiple: true
          value: "{key}"
          label: "{key}"
        description: "Pick the certification badges. New badges can be added under Badges in the sidebar."
      - name: specs
        label: Tech specs (icons under the title)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: icon
            label: Icon
            type: reference
            options:
              collection: icons
              value: "{key}"
              label: "{key}"
            description: "Pick a spec icon. New icons can be added under Spec icons in the sidebar."
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: standards
        label: Standards box (right side)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: standard
            label: Standard
            type: reference
            options:
              collection: standards
              value: "{key}"
              label: "{key}"
          - name: value
            label: Value
            type: string
            description: "e.g. the EAD or assessment number"
      - name: documents
        label: Documents (PDF links)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: size
            label: File size
            type: string
            description: Optional, e.g. 1 MB
          - name: url
            label: Link
            type: string
            required: true
      - name: features
        label: Technical features
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: label
            label: Label
            type: string
            description: Optional
          - name: value
            label: Text
            type: text
            required: true
      - name: columns
        label: Price table columns (pick these FIRST)
        type: reference
        options:
          collection: tableColumns
          multiple: true
          value: "{key}"
          label: "{label}"
        description: "STEP 1 — choose which columns this product's price table uses, in display order, from the searchable Table columns list (leave empty when the product has NO price table — the site then skips its variants section). If a needed column is missing, add it once under Table columns in the sidebar (it then becomes available to every product). STEP 2 — each variant row below then carries ONE line per chosen column, in this same order."
      - name: variants
        label: Variants (prices)
        type: object
        # OPTIONAL — a product without a price table simply leaves this
        # empty; the site then shows no variants section for it.
        list:
          collapsible:
            collapsed: true
            summary: "Row {index}"
        fields:
          # STEP 2 of the variants flow: pick columns first (see `columns`
          # above), then type one value per line into each row. The whole
          # row lives in ONE multiline text on purpose: multiline strings
          # survive the CMS round trip, while empty list/array items get
          # stripped — which would shift every following column of the row.
          - name: values
            label: Values (one column value per line, same order)
            type: text
            description: "ONE line per chosen column, in the SAME order as the Price table columns above. Example (SKU / Ø / Price chosen): line 1 \"HX 21 08 080\", line 2 \"8\", line 3 \"1.37\". A cell that is blank on the price list = an EMPTY line: press Enter and keep going. You may also stop early — any missing trailing line counts as a blank cell. Changed the column selection? Rewrite the lines to match the new order."

  # ------------------------------------------------------- categories
  # Catalog section pages (/products/<slug>, the Products mega-menu,
  # breadcrumbs, search badges). Products point at these via their
  # Category reference field, so an existing ID must never be renamed.
  - name: categories
    label: Catalog categories
    type: collection
    path: content/categories
    format: json
    filename: "{primary}.json"
    view:
      primary: id
      sort: order
      order: asc
    fields:
      - name: id
        label: ID (slug, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Becomes the page address (/products/<id>) and the link from products — e.g. roofing-fixing-systems. NEVER rename it: products reference this exact value."
      - name: order
        label: Menu order (1 = first)
        type: number
        description: "Optional — categories are listed (menu + category pages) from the lowest number up; empty ones come last, alphabetically."
      - name: labelEn
        label: Name (English)
        type: string
        required: true
      - name: labelKa
        label: Name (Georgian)
        type: string
        description: "Missing Georgian falls back to English (like the slider texts)."
      - name: descriptionEn
        label: Description (English)
        type: text
        description: "The intro paragraph on the category page and in the menu."
      - name: descriptionKa
        label: Description (Georgian)
        type: text
      - name: icon
        label: Icon image
        type: image
        options:
          media: categories
          rename: safe
        description: "The small tile picture used in the Products menu (roughly square works best)."

  # ------------------------------------------------------- stats band
  # The counting-numbers strip on the home page (below the featured
  # products). One file, fully editable.
  - name: stats
    label: Home page numbers (stats band)
    type: file
    path: content/stats.json
    format: json
    fields:
      - name: titleEn
        label: Headline (English)
        type: string
        description: "The big sentence above the four numbers."
      - name: titleKa
        label: Headline (Georgian)
        type: string
      - name: ctaEn
        label: Button text (English)
        type: string
        description: "The strip's button. Leave empty to show no button."
      - name: ctaKa
        label: Button text (Georgian)
        type: string
      - name: ctaLink
        label: Button link
        type: string
        description: "Page address for the button, e.g. /contacts."
      - name: items
        label: The numbers
        type: object
        list:
          collapsible:
            collapsed: false
        description: "Each row is one counter (number + label). Drag rows to reorder; the site counts the numbers up on scroll as before."
        fields:
          - name: value
            label: Number
            type: number
            required: true
          - name: labelEn
            label: Label (English)
            type: string
          - name: labelKa
            label: Label (Georgian)
            type: string

  # ------------------------------------------------------- home slider
  - name: slider
    label: Home slider
    type: file
    path: content/slider.json
    format: json
    fields:
      - name: autoplayMs
        label: Rotation speed (milliseconds)
        type: number
        description: "Optional — how long a slide stays up before auto-advancing (6000 = 6 seconds). Leave empty for the site default (6000). Rotation pauses on hover/focus and while a slide's video plays."
      - name: slides
        label: Slides
        type: block
        blockKey: type
        description: "ADD an item, then pick its type: an Image slide (photo background + texts) or a Video slide (uploaded/external video + texts). Drag the slide cards to reorder — the top card is the first slide visitors see."
        list:
          collapsible:
            collapsed: true
            summary: "Slide {index}"
        blocks:
          # Each slide is one of two block types; the editor clicks the
          # wanted type and only that block's fields show up (Pages CMS
          # block field, stored as { type: image|video, ...fields }).
          - name: image
            label: Image slide
            fields:
              - name: image
                label: Background image
                type: image
                options:
                  media: slider
                  rename: safe
                description: "Full-bleed photo behind the slide texts (wide webp/jpg works best). Optional — a slide can also be text-only on the themed background."
              - name: foreground
                label: Extra overlay image
                type: image
                options:
                  media: slider
                  rename: safe
                description: "Optional art layered over the right side of the slide."
              - name: titleEn
                label: Title (English)
                type: string
              - name: titleKa
                label: Title (Georgian)
                type: string
              - name: textEn
                label: Text (English)
                type: string
                description: "One or two sentences shown under the title."
              - name: textKa
                label: Text (Georgian)
                type: string
                description: "One or two sentences shown under the title."
              - name: altEn
                label: Image description (a11y, English)
                type: string
                description: "Optional — what the picture shows, for screen readers. Defaults to the slide title."
              - name: altKa
                label: Image description (a11y, Georgian)
                type: string
                description: "Optional — Georgian version of the description above."
              - name: variant
                label: Look variant
                type: select
                description: "Optional colour accent for the slide; leave Default selection empty for the standard look."
                options:
                  values:
                    - name: heavy
                      label: Heavy-duty accent
                    - name: chemical
                      label: Chemical accent
                    - name: fasteners
                      label: Fasteners accent
                    - name: drywall
                      label: Drywall accent
              - name: buttonTextEn
                label: Button text (English)
                type: string
                description: "e.g. Find out more. Leave empty → this slide shows NO button."
              - name: buttonTextKa
                label: Button text (Georgian)
                type: string
                description: "Georgian button text; leave empty → the Georgian site shows no button."
              - name: link
                label: Button link
                type: string
                description: "Where the button goes — page address like /products/roofing-fixing-systems or /video. Empty link opens the product catalog (/products). Only matters when a button text is set."
          - name: video
            label: Video slide
            fields:
              - name: videoFile
                label: Video file (upload)
                type: file
                options:
                  media: videos
                  rename: safe
                description: "Upload the MP4/WebM here (up to ~25 MB per file for Cloudflare Pages). Fill EITHER this OR Video URL — the upload wins if both are set."
              - name: videoUrl
                label: Video URL (external)
                type: string
                description: "Full https://… link of a video hosted elsewhere (e.g. the Tecfi storage clip). Used when the upload above is empty."
              - name: poster
                label: Poster image
                type: string
                description: "Optional still image shown until the video loads — an uploaded slider image path (/content/images/slider/…) or a full https://… URL."
              - name: titleEn
                label: Title (English)
                type: string
              - name: titleKa
                label: Title (Georgian)
                type: string
              - name: textEn
                label: Text (English)
                type: string
                description: "One or two sentences shown under the title."
              - name: textKa
                label: Text (Georgian)
                type: string
                description: "One or two sentences shown under the title."
              - name: altEn
                label: Video description (a11y, English)
                type: string
                description: "Optional — what the video shows, for screen readers. Defaults to the slide title."
              - name: altKa
                label: Video description (a11y, Georgian)
                type: string
                description: "Optional — Georgian version of the description above."
              - name: buttonTextEn
                label: Button text (English)
                type: string
                description: "e.g. Watch all videos. Leave empty → this slide shows NO button."
              - name: buttonTextKa
                label: Button text (Georgian)
                type: string
                description: "Georgian button text; leave empty → the Georgian site shows no button."
              - name: link
                label: Button link
                type: string
                description: "Where the button goes — page address like /products/roofing-fixing-systems or /video. Empty link opens the product catalog (/products). Only matters when a button text is set."

  # ------------------------------------------------------- badge library
  - name: badges
    label: Badges
    type: collection
    path: content/badges
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label (English)
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: value
        label: Second line
        type: string
        description: "Optional extra line shown under the badge on the product page (leave empty to hide)."
      - name: image
        label: Badge artwork
        type: image
        options:
          media: badges
          rename: safe
        required: true

  # ------------------------------------------------------- spec icon library
  - name: specIcons
    label: Spec icons
    type: collection
    path: content/icons
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: image
        label: Icon artwork
        type: image
        options:
          media: icons
          rename: safe
        required: true

  # ------------------------------------------------------- standards library
  - name: standardDefs
    label: Standards
    type: collection
    path: content/standards
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label (English)
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: tab
        label: Tab artwork
        type: image
        options:
          media: standards
          rename: safe
        required: true
      - name: badge
        label: Badge artwork
        type: image
        options:
          media: standards
          rename: safe

  # ------------------------------------------------------- table columns
  - name: tableColumns
    label: Table columns
    type: collection
    path: content/table-columns
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Header text (English)
        type: string
        required: true
        description: Shown as the column title, e.g. Thread
      - name: labelKa
        label: Header text (Georgian)
        type: string
      - name: type
        label: Column type
        type: select
        options:
          values:
            - name: text
              label: Text
            - name: number
              label: Number
        description: "Number columns feed the facts strip under the product title (the site lists their distinct values, e.g. diameters 8–16). Text is fine for codes like SKU."
      - name: role
        label: Special use (optional)
        type: select
        options:
          values:
            - name: sku
              label: SKU — product search & variant card titles
            - name: price
              label: Price — price strip, 'from ₾' labels & price range
            - name: diameter
              label: Diameter — used in auto product description
            - name: length
              label: Length — used in auto product description
        description: "Optional feature wiring. Leave empty for ordinary data columns. Choose at most one SKU and one Price column per product's pick — the first match wins."

  # ------------------------------------------------------- applications
  # Usage pages shown under /applications ("where products are used",
  # mirroring tecfi.it). Applications carry NO product list of their own:
  # an application page lists every product whose "Applications" pick
  # contains it, so membership is maintained from the product side only
  # (one application may mix products of several categories).
  - name: applications
    label: Applications (usage pages)
    type: collection
    path: content/applications
    format: json
    filename: "{primary}.json"
    view:
      primary: id
      sort: order
      order: asc
    fields:
      - name: id
        label: ID (slug, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Becomes the page address (/applications/<id>) and the link between products and this page — e.g. roofing. Never change it after products have picked it."
      - name: order
        label: Order (1 = first)
        type: number
        description: "Optional — the Applications page lists cards from the lowest number up; empty ones come last, alphabetically."
      - name: labelEn
        label: Name (English)
        type: string
        required: true
      - name: labelKa
        label: Name (Georgian)
        type: string
        description: "Missing Georgian falls back to English (like the slider texts)."
      - name: descriptionEn
        label: Description (English)
        type: text
        description: "One or two sentences shown on the application page under the title."
      - name: descriptionKa
        label: Description (Georgian)
        type: text
      - name: image
        label: Card image
        type: image
        options:
          media: applications
          rename: safe
        description: "The tile photo on the /applications overview page (wide webp/jpg works best)."

  # ------------------------------------------------------- contact info
  - name: contact
    label: Contact info
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: nameEn
        label: Company name (English)
        type: string
      - name: nameKa
        label: Company name (Georgian)
        type: string
      - name: addressEn
        label: Address (English)
        type: string
      - name: addressKa
        label: Address (Georgian)
        type: string
      - name: phones
        label: Phone numbers
        type: string
        list: true
      - name: email
        label: Email
        type: string
      - name: mapUrl
        label: Map / directions URL
        type: string

  # ------------------------------------------------------- featured on home
  - name: highlighted
    label: Featured products (home page)
    type: file
    path: src/data/highlighted.json
    format: json
    fields:
      - name: title
        label: Section title
        type: string
      - name: subtitle
        label: Section subtitle
        type: string
      - name: cta
        label: Button text
        type: string
      - name: items
        label: Products
        type: reference
        options:
          collection: products
          multiple: true
          value: "{id}"
          label: "{series}"

  # ------------------------------------------------------- price updater
  # Editors fill this form in the CMS; saving it triggers the "Price
  # update" GitHub Action (docs/EDITOR-GUIDE.md — "Updating prices in
  # bulk"), which rewrites every price cell of the chosen products by the
  # entered percent and then resets this form, so saving the same form
  # twice costs nothing.
  - name: priceUpdater
    label: Price updater (bulk %)
    type: file
    path: content/price-update.json
    format: json
    fields:
      - name: percent
        label: Change by percent (%)
        type: number
        description: "How much to move prices by, as a plain number — 10 means ±10%, 2.5 means ±2.5%. Leave 0 (the default) when nothing should happen."
      - name: direction
        label: Direction
        type: select
        default: increase
        options:
          values:
            - name: increase
              label: Increase prices (+)
            - name: decrease
              label: Decrease prices (−)
        description: "Decrease is also safe — a price would never be allowed to drop below 0.01 (a 100% or larger decrease clamps to 0.01 instead of zero)."
      - name: allProducts
        label: Apply to ALL products
        type: boolean
        description: "ON → every price cell in every product's table is updated. Leave OFF to pick products below."
      - name: products
        label: Products (when not ALL)
        type: reference
        options:
          collection: products
          multiple: true
          value: "{id}"
          label: "{series} — {titleEn}"
        description: "Search and pick one or several products (click a chip to remove it). Ignored when Apply to ALL is on."
      - name: note
        label: Note (optional, not published)
        type: string
        description: "Anything you want to remember about this update, e.g. 'Q2 supplier list'. Shown nowhere on the site."
