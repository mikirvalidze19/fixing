# Pages CMS configuration — https://pagescms.org
#
# This file defines the editor forms for the Fixing Systems Georgia catalog.
# Editors open https://app.pagescms.org/mikirvalidze19/fixing, log in with a
# GitHub account that has write access to this repository, and manage the
# products. Every save is a commit; Cloudflare Pages rebuilds and publishes
# automatically.
#
# The site (React app) reads everything from the `content/` folder at build
# time via src/data/catalog.ts — no backend involved.

media:
  - name: products
    label: Product photos
    input: content/images/products
    output: /content/images/products
    extensions: [webp, jpg, jpeg, png]
  - name: badges
    label: Certification badge artwork
    input: content/images/badges
    output: /content/images/badges
    extensions: [webp, jpg, jpeg, png, svg]
  - name: icons
    label: Spec icon artwork
    input: content/images/icons
    output: /content/images/icons
    extensions: [webp, jpg, jpeg, png, svg]
  - name: standards
    label: Standards artwork
    input: content/images/standards
    output: /content/images/standards
    extensions: [webp, jpg, jpeg, png, svg]

content:
  # ---------------------------------------------------------------- products
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    view:
      primary: id
      sort: series
      order: asc
    fields:
      - name: id
        label: ID (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Lowercase letters/numbers/dashes, unique. Becomes the page address (/product/{id}), e.g. hxe01"
      - name: series
        label: Series code
        type: string
        required: true
        description: "As printed on the price list, e.g. HXE01"
      - name: titleEn
        label: Title (English)
        type: string
        required: true
      - name: titleKa
        label: Title (Georgian)
        type: string
        required: true
      - name: category
        label: Category
        type: select
        description: Where the product appears in the catalog and navigation
        options:
          values:
            - name: roofing-fixing-systems
              label: Roofing fixing systems
            - name: renewable-energy-plants
              label: Fixing systems for renewable energy plants
            - name: heavy-duty-metallic
              label: Heavy duty metallic fixing systems
            - name: chemical-fixings
              label: Chemical fixings and accessories
            - name: scaffoldings-ropes-nets
              label: Fixing systems for scaffoldings, ropes and nets
            - name: windows-frames-facades
              label: Windows, frames and façades
            - name: light-fixing
              label: Light fixing systems
            - name: drywall-hollow
              label: Drywall and hollow fixing systems
            - name: wood
              label: Fixing systems for wood
            - name: rivets
              label: Rivets
            - name: sealants-foams
              label: Sealants and foams
            - name: cable-plumbing
              label: Cable and plumbing fixings
            - name: general-fasteners
              label: General fasteners
            - name: drills-bits-sockets
              label: Drills, bits and sockets
            - name: inblister
              label: inBlister
      - name: youtube
        label: YouTube link
        type: string
        description: "Paste the full YouTube link (watch/youtu.be) or just the video ID. Shown at the bottom of the product page."
      - name: image
        label: Product photo
        type: image
        options:
          media: products
          rename: safe
        description: "Tip: name the file after the product ID before uploading (e.g. hxe01.jpg). Without a photo the site shows the series code."
      - name: descriptionEn
        label: Description (English)
        type: text
        description: "Optional. Leave empty to auto-generate the intro text from the price table."
      - name: descriptionKa
        label: Description (Georgian)
        type: text
        description: "Optional. Leave empty to auto-generate the intro text from the price table."
      - name: certifications
        label: Certifications
        type: reference
        options:
          collection: badges
          multiple: true
          value: "{key}"
          label: "{key}"
        description: "Pick the certification badges. New badges can be added under Badges in the sidebar."
      - name: specs
        label: Tech specs (icons under the title)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: icon
            label: Icon
            type: reference
            options:
              collection: icons
              value: "{key}"
              label: "{key}"
            description: "Pick a spec icon. New icons can be added under Spec icons in the sidebar."
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: standards
        label: Standards box (right side)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: standard
            label: Standard
            type: reference
            options:
              collection: standards
              value: "{key}"
              label: "{key}"
          - name: value
            label: Value
            type: string
            description: "e.g. the EAD or assessment number"
      - name: documents
        label: Documents (PDF links)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: size
            label: File size
            type: string
            description: Optional, e.g. 1 MB
          - name: url
            label: Link
            type: string
            required: true
      - name: features
        label: Technical features
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: label
            label: Label
            type: string
            description: Optional
          - name: value
            label: Text
            type: text
            required: true
      - name: variantColumns
        label: Price table columns (optional — choose before adding variants)
        type: reference
        options:
          collection: tableHeaders
          multiple: true
          value: "{key}"
          label: "{label}"
        description: "STEP 1 — pick the table columns in display order from the searchable list (leave empty for the standard table: SKU / Ø / Length / Units / Price / Note). Need a different header? Add it once under Table headers in the sidebar. Then, in STEP 2 (Variants below), enter one value per chosen column, in that order."
      - name: variants
        label: Variants (prices)
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "Row {index}"
        fields:
          # STEP 2 of the variants flow: editor picks columns first (see
          # variantColumns above), then enters one value per column here.
          - name: cells
            label: Values (one per chosen column, same order)
            type: string
            list: true
            description: "Add one row item per cell of the price table, top to bottom as printed. Type exactly one value per chosen column, in the SAME order as the Price table columns above (e.g. if you picked SKU / Ø / Price: \"HX 21 08 080\", \"8\", \"1.37\"). Leave an item empty when the printed cell is blank."
          # --- Legacy named fields (pre-CMS files) -----------------------
          # Hidden from the editor but DECLARED so the CMS keeps writing
          # them when an old product is re-saved. Do not remove.
          - name: sku
            type: string
            hidden: true
          - name: diameterMm
            type: string
            hidden: true
          - name: lengthMm
            type: string
            hidden: true
          - name: unitsPerBox
            type: number
            hidden: true
          - name: priceGel
            type: number
            hidden: true
          - name: note
            type: string
            hidden: true
          - name: text1
            type: string
            hidden: true
          - name: text2
            type: string
            hidden: true
          - name: text3
            type: string
            hidden: true

  # ------------------------------------------------------- badge library
  - name: badges
    label: Badges
    type: collection
    path: content/badges
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label (English)
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: value
        label: Second line
        type: string
        description: "Optional extra line shown under the badge on the product page (leave empty to hide)."
      - name: image
        label: Badge artwork
        type: image
        options:
          media: badges
          rename: safe
        required: true

  # ------------------------------------------------------- spec icon library
  - name: specIcons
    label: Spec icons
    type: collection
    path: content/icons
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: image
        label: Icon artwork
        type: image
        options:
          media: icons
          rename: safe
        required: true

  # ------------------------------------------------------- standards library
  - name: standardDefs
    label: Standards
    type: collection
    path: content/standards
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Label (English)
        type: string
        required: true
      - name: labelKa
        label: Label (Georgian)
        type: string
      - name: tab
        label: Tab artwork
        type: image
        options:
          media: standards
          rename: safe
        required: true
      - name: badge
        label: Badge artwork
        type: image
        options:
          media: standards
          rename: safe

  # ------------------------------------------------------- table headers library
  - name: tableHeaders
    label: Table headers
    type: collection
    path: content/headers
    format: json
    filename: "{primary}.json"
    view:
      primary: key
      sort: key
      order: asc
    fields:
      - name: key
        label: Key (short code, lowercase)
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9-]*$"
      - name: label
        label: Header text (English)
        type: string
        required: true
        description: Shown as the column title, e.g. Thread
      - name: labelKa
        label: Header text (Georgian)
        type: string
      - name: slot
        label: What the column shows
        type: select
        required: true
        options:
          values:
            - name: sku
              label: SKU
            - name: diameterMm
              label: Diameter mm
            - name: lengthMm
              label: Length mm
            - name: unitsPerBox
              label: Units per box
            - name: priceGel
              label: Price GEL
            - name: note
              label: Note
            - name: text1
              label: Extra text 1
            - name: text2
              label: Extra text 2
            - name: text3
              label: Extra text 3

  # ------------------------------------------------------- featured on home
  - name: highlighted
    label: Featured products (home page)
    type: file
    path: src/data/highlighted.json
    format: json
    fields:
      - name: title
        label: Section title
        type: string
      - name: subtitle
        label: Section subtitle
        type: string
      - name: cta
        label: Button text
        type: string
      - name: items
        label: Products
        type: reference
        options:
          collection: products
          multiple: true
          value: "{id}"
          label: "{series}"
